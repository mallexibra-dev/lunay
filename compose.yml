services:
  db:
    image: postgres:16-alpine
    container_name: lunay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunay
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi (lihat .env)}
      POSTGRES_DB: lunay
    volumes:
      - lunay_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunay -d lunay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lunay

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://lunay.mallexibra.my.id/api}
    container_name: lunay-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Cuma listen di localhost — akses publik lewat Cloudflare Tunnel
      - "127.0.0.1:3103:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lunay

networks:
  lunay:

volumes:
  lunay_db_data:
